{% extends "base.html" %}

{% block title %}SecuDoc - Đăng Nhập Hệ Thống{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Cổng Đăng Nhập Quản Trị</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Xác thực bảo mật PBKDF2-HMAC-SHA256 & Phân quyền RBAC
      </p>
    </div>

    <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập:</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="Nhập tên đăng nhập" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu:</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="Nhập mật khẩu an toàn" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        Đăng Nhập An Toàn
      </button>
    </form>


  </div>
</div>
{% endblock %}
